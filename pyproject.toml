[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "disp"
authors = [{name = "Bonan Zhu", email = "bonan.zhu@ucl.ac.uk"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
requires-python = ">=3.10"

dependencies = [
            "fireworks>=1.9.5", "numpy>=1.21", "click>=8.0", "spglib>=2.0", "ase>=3.22",
            "pandas>=1.4", "mongoengine>=0.29,<1", "mongomock>=4.1,<5"
        ]

[project.optional-dependencies]
doc = [
    "mkdocs~=1.2", "mkdocs-material~=8.2.1"
]
test = ["pytest>=8,<9"]
vasp = ["atomate"]

[project.scripts]
ggulp = "disp.cli.cmd_ggulp:main"
disp = "disp.cli.cmd_disp:main"
trlaunch = "disp.cli.trlaunch:trlaunch"

[project.urls]
Home = "https://github.com/zhubonan/disp"
