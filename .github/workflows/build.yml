# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
# Note: small maintenance edits may be used to retrigger CI validation runs.

name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: MongoDB in GitHub Actions
      uses: supercharge/mongodb-github-action@1.3.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test]

    - name: Install AIRSS
      run: |
        sudo apt-get install gfortran liblapack-dev
        wget -O airss-v0.9.4.tgz https://www.mtg.msm.cam.ac.uk/files/airss-v0.9.4.tgz
        tar zxf airss-v0.9.4.tgz
        cd airss/
        make buildcell
        make cabal
        make cryan
        make pp3
        cp src/buildcell/src/buildcell bin/
        cp src/cryan/src/cryan bin/
        cp src/cabal/src/cabal bin/
        cp src/pp3/src/pp3 bin/
        cd ../

    - name: Test with pytest
      run: |
        export PATH=`pwd`/airss-v0.9.4/bin:$PATH
        which buildcell
        pytest
